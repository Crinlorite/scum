server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro genera páginas como /items/awp/index.html. try_files resuelve
    # tanto /items/awp/ como /items/awp (sin barra) sin redirecciones raras.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Panel privado (comandos de admin, mapa…): HTTP Basic Auth.
    # El .htpasswd lo genera el Dockerfile desde PANEL_USER/PANEL_PASS (Coolify).
    # Si no se definen, el fichero queda vacío → 401 siempre (cerrado por defecto).
    location /panel/ {
        auth_basic "Panel privado";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Página 404 propia (dist/404.html).
    error_page 404 /404.html;

    # Assets con hash en el nombre → caché agresiva e inmutable.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Compresión.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
