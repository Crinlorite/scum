server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro genera páginas como /items/awp/index.html. try_files resuelve
    # tanto /items/awp/ como /items/awp (sin barra) sin redirecciones raras.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Endpoint de salud para el HEALTHCHECK del contenedor (Coolify). Sin logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Panel privado: login con Discord (sustituye al HTTP Basic Auth) ──────
    # nginx pregunta a /panel/api/authz (backend del host, 10.0.1.1:9787) si la
    # cookie de sesión es válida → 200 deja pasar, 401 manda al login de Discord.

    # Validador de sesión: subpetición interna (no accesible directamente).
    location = /panel/api/authz {
        internal;
        proxy_pass http://10.0.1.1:9787/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Rutas de login (PÚBLICAS, sin authz): /panel/api/auth/{login,callback,me,logout}.
    location /panel/api/auth/ {
        proxy_pass http://10.0.1.1:9787/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Páginas del panel (mapa, comandos…): requieren sesión; sin ella → login Discord.
    location /panel/ {
        auth_request /panel/api/authz;
        error_page 401 = @panel_login;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location @panel_login { return 302 /panel/api/auth/login; }

    # Mini-API de POIs (y resto del backend): requiere sesión. proxy_pass con barra
    # final → /panel/api/add llega al backend como /add. 401 limpio para los fetch().
    location /panel/api/ {
        auth_request /panel/api/authz;
        proxy_pass http://10.0.1.1:9787/;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Feed de posiciones (cambia constantemente, nunca cachear): requiere sesión.
    location = /panel/live/positions.json {
        auth_request /panel/api/authz;
        error_page 401 = @panel_login;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Página 404 propia (dist/404.html).
    error_page 404 /404.html;

    # Assets con hash en el nombre → caché agresiva e inmutable.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Compresión.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
