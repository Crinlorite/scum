server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro genera páginas como /items/awp/index.html. try_files resuelve
    # tanto /items/awp/ como /items/awp (sin barra) sin redirecciones raras.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Endpoint de salud para el HEALTHCHECK del contenedor (Coolify). Sin logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Panel privado (comandos de admin, mapa…): HTTP Basic Auth.
    # El .htpasswd lo genera el Dockerfile desde PANEL_USER/PANEL_PASS (Coolify).
    # Si no se definen, el fichero queda vacío → 401 siempre (cerrado por defecto).
    location /panel/ {
        auth_basic "Panel privado";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # El panel (mapa en vivo, etc.) cambia con cada deploy → no cachear el HTML,
        # así no hay que forzar refresco tras un redeploy. Los assets /_astro/ van con
        # hash y sí se cachean.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Alta/baja de POIs privados → mini-API en el host (gateway de la red coolify,
    # 10.0.1.1:9787, NO pública), tras el MISMO Basic Auth del panel. proxy_pass con
    # barra final → /panel/api/add llega al backend como /add.
    location /panel/api/ {
        auth_basic "Panel privado";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://10.0.1.1:9787/;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # El feed de posiciones cambia constantemente → nunca cachear.
    location = /panel/live/positions.json {
        auth_basic "Panel privado";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Página 404 propia (dist/404.html).
    error_page 404 /404.html;

    # Assets con hash en el nombre → caché agresiva e inmutable.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Compresión.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
